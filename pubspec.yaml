name: finals_project
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+2

environment:
  sdk: ^3.12.2

dependencies:
  firebase_core: ^4.14.0
  firebase_database: ^12.5.0
  firebase_auth: ^6.1.0
  flutter:
    sdk: flutter
  image_picker_widget: ^3.0.1
  crypto: ^3.0.8
  image_picker: ^1.2.4
  google_fonts: ^8.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

web:
  generate: true
  image_path: "assets/images/icon.png"
  background_color: "#14233B"
  theme_color: "#14233B"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#4B4590"
  adaptive_icon_foreground: "assets/images/logo.png"